<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Crimping Kabel UTP - Futuristik</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #0ea5e9;
            --primary-glow: rgba(14, 165, 233, 0.4);
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 950px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03), 0 1px 3px rgba(0,0,0,0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            text-align: center;
            background: linear-gradient(90deg, #0f172a, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .description {
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-muted);
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
        }

        .controls label {
            font-weight: 600;
            font-size: 0.9rem;
            margin-right: 8px;
        }

        select, button {
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            background: white;
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        button:hover {
            transform: translateY(-2px);
            background-color: #0284c7;
            box-shadow: 0 6px 16px var(--primary-glow);
        }

        button.reset-btn {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-light);
            box-shadow: none;
        }

        button.reset-btn:hover {
            background-color: #f1f5f9;
            color: var(--text-main);
            transform: translateY(0);
        }

        /* Dynamic Legend Guide */
        .color-legend {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
            font-size: 0.8rem;
            background: #fafafa;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #edf2f7;
            align-items: center;
        }

        .legend-header {
            width: 100%;
            text-align: center;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--primary);
            font-size: 0.85rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text-muted);
        }

        .legend-badge {
            font-weight: 800;
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            color: #0f172a;
        }

        /* Wires Palette */
        .palette-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px dashed var(--border-light);
            transition: border-color 0.3s ease;
        }

        .palette-container:hover {
            border-color: var(--primary);
        }

        .palette-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .wires-palette {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            min-height: 70px;
        }

        .wire {
            width: 42px;
            height: 85px;
            border-radius: 8px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            user-select: none;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .wire::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
            pointer-events: none;
        }

        .wire:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }

        .wire:active {
            cursor: grabbing;
            transform: translateY(0) scale(0.95);
        }

        .wire.selected {
            box-shadow: 0 0 0 3px var(--primary), 0 0 15px var(--primary-glow);
            transform: translateY(-5px);
        }

        /* Color Variations */
        .w-orange-white { background: linear-gradient(135deg, #fb923c 50%, #f8fafc 50%); color: #431407; }
        .w-orange       { background: linear-gradient(135deg, #f97316, #ea580c); color: #ffffff; text-shadow: 0 0 3px rgba(0,0,0,0.6); }
        .w-green-white  { background: linear-gradient(135deg, #4ade80 50%, #f8fafc 50%); color: #14532d; }
        .w-blue         { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #ffffff; text-shadow: 0 0 3px rgba(0,0,0,0.6); }
        .w-blue-white   { background: linear-gradient(135deg, #38bdf8 50%, #f8fafc 50%); color: #0c4a6e; }
        .w-green        { background: linear-gradient(135deg, #22c55e, #16a34a); color: #ffffff; text-shadow: 0 0 3px rgba(0,0,0,0.6); }
        .w-brown-white  { background: linear-gradient(135deg, #a8a29e 50%, #f8fafc 50%); color: #44403c; }
        .w-brown        { background: linear-gradient(135deg, #78716c, #57534e); color: #ffffff; text-shadow: 0 0 3px rgba(0,0,0,0.6); }

        /* RJ-45 Connectors Area */
        .connectors-area {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .connector-box {
            background: #ffffff;
            border: 1px solid var(--border-light);
            padding: 20px;
            border-radius: 16px;
            width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            position: relative;
        }

        .connector-title {
            font-weight: 800;
            font-size: 0.9rem;
            margin-bottom: 20px;
            color: var(--text-main);
            background: #f1f5f9;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
        }

        /* Stylized RJ-45 Head */
        .rj45-head {
            background: #f8fafc;
            border: 2px solid var(--border-light);
            border-bottom: 6px solid #cbd5e1;
            border-radius: 12px 12px 4px 4px;
            padding: 15px 10px 0 10px;
            display: flex;
            gap: 6px;
            position: relative;
        }

        .rj45-head::before {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 10%;
            width: 80%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #fbbf24, transparent);
            opacity: 0.5;
        }

        .pin-slot {
            width: 42px;
            height: 100px;
            background: #ffffff;
            border: 1px dashed #cbd5e1;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            position: relative;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .pin-slot.drag-over, .pin-slot:hover {
            background: #f0f9ff;
            border-color: var(--primary);
            box-shadow: inset 0 0 10px var(--primary-glow);
        }

        .pin-number {
            position: absolute;
            top: -25px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 800;
            background: white;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-light);
        }

        .pin-slot .wire {
            height: 100%;
            width: 100%;
            border-radius: 4px;
            box-shadow: none;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .result-box {
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            display: none;
            animation: slideUp 0.4s ease;
            width: 100%;
            margin-top: 15px;
        }

        @keyframes slideUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .result-box.success {
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #34d399;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.1);
        }

        .result-box.error {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #f87171;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.1);
            white-space: pre-line;
        }

        @media (max-width: 900px) {
            .connector-box { width: 100%; }
            .pin-slot { width: 34px; height: 90px; }
            .wire { width: 34px; height: 75px; font-size: 0.65rem; }
            .description { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Simulasi Crimping RJ-45</h1>
    <p class="description">Tarik kawat warna (Drag & Drop) atau <strong>Ketuk Kawat lalu Ketuk Slot Pin</strong> untuk memasukkannya ke konektor RJ-45.</p>

    <div class="controls">
        <div>
            <label for="cableMode">Mode Kabel:</label>
            <select id="cableMode" onchange="resetSimulation()">
                <option value="straight-b">Straight-through (T568B)</option>
                <option value="straight-a">Straight-through (T568A)</option>
                <option value="crossover">Crossover (T568A ke T568B)</option>
            </select>
        </div>
        <button onclick="checkCrimping()">Uji Koneksi</button>
        <button class="reset-btn" onclick="resetSimulation()">Reset</button>
    </div>

    <!-- Container Petunjuk Warna Dinamis -->
    <div class="color-legend" id="colorLegend"></div>

    <div class="palette-container">
        <div class="palette-title">Kotak Kawat (Tersedia)</div>
        <div class="wires-palette" id="wirePalette"></div>
    </div>

    <div class="connectors-area">
        <div class="connector-box">
            <div class="connector-title" id="titleEndA">Konektor 1 - Ujung A</div>
            <div class="rj45-head" id="headA"></div>
        </div>

        <div class="connector-box">
            <div class="connector-title" id="titleEndB">Konektor 2 - Ujung B</div>
            <div class="rj45-head" id="headB"></div>
        </div>
    </div>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
    const colorTypes = [
        { id: 'OW', name: 'Putih-Oranye', class: 'w-orange-white' },
        { id: 'O',  name: 'Oranye',       class: 'w-orange' },
        { id: 'GW', name: 'Putih-Hijau',  class: 'w-green-white' },
        { id: 'B',  name: 'Biru',         class: 'w-blue' },
        { id: 'BW', name: 'Putih-Biru',   class: 'w-blue-white' },
        { id: 'G',  name: 'Hijau',        class: 'w-green' },
        { id: 'BRW',name: 'Putih-Cokelat',class: 'w-brown-white' },
        { id: 'BR', name: 'Cokelat',      class: 'w-brown' }
    ];

    const T568B = ['OW', 'O', 'GW', 'B', 'BW', 'G', 'BRW', 'BR'];
    const T568A = ['GW', 'G', 'OW', 'B', 'BW', 'O', 'BRW', 'BR'];

    let draggedElement = null;
    let selectedWireForTap = null;

    function initSimulation() {
        selectedWireForTap = null;
        createPalette();
        createSlots('headA', 'A');
        createSlots('headB', 'B');
        updateTitles();
        updateLegend();
        
        document.getElementById('wirePalette').addEventListener('click', (e) => {
            if(e.target === document.getElementById('wirePalette') && selectedWireForTap) {
                clearSelection();
            }
        });
    }

    function updateTitles() {
        const mode = document.getElementById('cableMode').value;
        const titleA = document.getElementById('titleEndA');
        const titleB = document.getElementById('titleEndB');

        if (mode === 'straight-b') {
            titleA.innerText = 'Konektor 1 - Ujung A (T568B)';
            titleB.innerText = 'Konektor 2 - Ujung B (T568B)';
        } else if (mode === 'straight-a') {
            titleA.innerText = 'Konektor 1 - Ujung A (T568A)';
            titleB.innerText = 'Konektor 2 - Ujung B (T568A)';
        } else if (mode === 'crossover') {
            titleA.innerText = 'Konektor 1 - Ujung A (T568A / T568B)';
            titleB.innerText = 'Konektor 2 - Ujung B (T568B / T568A)';
        }
    }

    function updateLegend() {
        const mode = document.getElementById('cableMode').value;
        const legendContainer = document.getElementById('colorLegend');
        
        let targetSeq = [];
        let titleText = '';

        if (mode === 'straight-a') {
            targetSeq = T568A;
            titleText = 'Panduan Urutan Pin (Standar T568A):';
        } else if (mode === 'straight-b') {
            targetSeq = T568B;
            titleText = 'Panduan Urutan Pin (Standar T568B):';
        } else if (mode === 'crossover') {
            targetSeq = T568A;
            titleText = 'Panduan Urutan Pin Crossover (Konektor 1 = T568A, Konektor 2 = T568B):';
        }

        let html = `<div class="legend-header">${titleText}</div>`;
        targetSeq.forEach((colorId, idx) => {
            const colorObj = colorTypes.find(c => c.id === colorId);
            html += `
                <div class="legend-item">
                    <span class="legend-badge">${idx + 1}. ${colorObj.id}</span> ${colorObj.name}
                </div>
            `;
        });

        legendContainer.innerHTML = html;
    }

    function createPalette() {
        const palette = document.getElementById('wirePalette');
        palette.innerHTML = '';
        const doubleColors = [...colorTypes, ...colorTypes];
        doubleColors.sort(() => Math.random() - 0.5);

        doubleColors.forEach((color, idx) => {
            const wire = document.createElement('div');
            wire.className = `wire ${color.class}`;
            wire.draggable = true;
            wire.dataset.colorId = color.id;
            wire.id = `wire-${idx}`;
            wire.innerText = color.id; 
            wire.title = `${color.name} (${color.id})`;
            
            wire.addEventListener('dragstart', handleDragStart);
            wire.addEventListener('dragend', handleDragEnd);
            wire.addEventListener('click', handleWireClick);

            palette.appendChild(wire);
        });

        palette.addEventListener('dragover', handleDragOver);
        palette.addEventListener('drop', handleDropPalette);
    }

    function createSlots(headId, endTag) {
        const head = document.getElementById(headId);
        head.innerHTML = '';

        for (let i = 1; i <= 8; i++) {
            const slot = document.createElement('div');
            slot.className = 'pin-slot';
            slot.dataset.pinNumber = i;
            slot.dataset.end = endTag;

            const numSpan = document.createElement('span');
            numSpan.className = 'pin-number';
            numSpan.innerText = i;
            slot.appendChild(numSpan);

            slot.addEventListener('dragover', handleDragOverSlot);
            slot.addEventListener('dragleave', handleDragLeaveSlot);
            slot.addEventListener('drop', handleDropSlot);
            slot.addEventListener('click', handleSlotClick);

            head.appendChild(slot);
        }
    }

    function handleDragStart(e) {
        draggedElement = e.target;
        e.dataTransfer.setData('text/plain', e.target.id);
        setTimeout(() => e.target.style.opacity = '0.5', 0);
        clearSelection();
    }

    function handleDragEnd(e) {
        e.target.style.opacity = '1';
        draggedElement = null;
        document.querySelectorAll('.pin-slot').forEach(s => s.classList.remove('drag-over'));
    }

    function handleDragOver(e) { e.preventDefault(); }
    
    function handleDragOverSlot(e) {
        e.preventDefault();
        e.currentTarget.classList.add('drag-over');
    }

    function handleDragLeaveSlot(e) {
        e.currentTarget.classList.remove('drag-over');
    }

    function handleDropSlot(e) {
        e.preventDefault();
        const slot = e.currentTarget;
        slot.classList.remove('drag-over');
        moveWireToSlot(draggedElement, slot);
    }

    function handleDropPalette(e) {
        e.preventDefault();
        if (draggedElement) {
            document.getElementById('wirePalette').appendChild(draggedElement);
        }
    }

    function handleWireClick(e) {
        e.stopPropagation();
        const wire = e.currentTarget;

        if (wire.parentElement.classList.contains('pin-slot')) {
            document.getElementById('wirePalette').appendChild(wire);
            clearSelection();
            return;
        }

        if (selectedWireForTap === wire) {
            clearSelection();
        } else {
            clearSelection();
            selectedWireForTap = wire;
            wire.classList.add('selected');
        }
    }

    function handleSlotClick(e) {
        const slot = e.currentTarget;
        
        if (selectedWireForTap) {
            moveWireToSlot(selectedWireForTap, slot);
            clearSelection();
        } else if (slot.children.length > 1) {
            const existingWire = slot.querySelector('.wire');
            document.getElementById('wirePalette').appendChild(existingWire);
        }
    }

    function clearSelection() {
        if (selectedWireForTap) {
            selectedWireForTap.classList.remove('selected');
            selectedWireForTap = null;
        }
    }

    function moveWireToSlot(wireElement, slotElement) {
        if (!wireElement) return;

        if (slotElement.children.length > 1) {
            const existingWire = slotElement.querySelector('.wire');
            document.getElementById('wirePalette').appendChild(existingWire);
        }
        slotElement.appendChild(wireElement);
    }

    function checkCrimping() {
        const mode = document.getElementById('cableMode').value;
        const resultBox = document.getElementById('resultBox');

        let targetA = mode === 'straight-a' ? T568A : T568B;
        let targetB = mode === 'straight-a' ? T568A : T568B;
        if (mode === 'crossover') targetA = T568A;

        const currentA = getSlotColors('A');
        const currentB = getSlotColors('B');

        // Memastikan elemen hasil ditampilkan kembali
        resultBox.style.display = 'block';

        if (currentA.includes(null) || currentB.includes(null)) {
            resultBox.className = 'result-box error';
            resultBox.innerText = '❌ Gagal: Semua 16 slot pin (Konektor 1 & Konektor 2) harus terisi kawat!';
            return;
        }

        let isCorrectA = JSON.stringify(currentA) === JSON.stringify(targetA);
        let isCorrectB = JSON.stringify(currentB) === JSON.stringify(targetB);

        if (mode === 'crossover' && (!isCorrectA || !isCorrectB)) {
            if (JSON.stringify(currentA) === JSON.stringify(T568B) && 
                JSON.stringify(currentB) === JSON.stringify(T568A)) {
                isCorrectA = true;
                isCorrectB = true;
            }
        }

        if (isCorrectA && isCorrectB) {
            resultBox.className = 'result-box success';
            resultBox.innerHTML = '🎉 <strong>Berhasil!</strong><br>Urutan warna kabel tepat. Koneksi terhubung sempurna (PASS).';
        } else {
            resultBox.className = 'result-box error';
            let msg = '❌ <strong>Gagal! Urutan warna salah.</strong>\n';
            if (!isCorrectA) msg += '- Konektor 1 (Ujung A) tidak sesuai standar yang dipilih.\n';
            if (!isCorrectB) msg += '- Konektor 2 (Ujung B) tidak sesuai standar yang dipilih.\n';
            resultBox.innerHTML = msg.replace(/\n/g, '<br>');
        }
    }

    function getSlotColors(endTag) {
        const slots = document.querySelectorAll(`.pin-slot[data-end="${endTag}"]`);
        const colors = [];
        slots.forEach(slot => {
            const wire = slot.querySelector('.wire');
            colors.push(wire ? wire.dataset.colorId : null);
        });
        return colors;
    }

    function resetSimulation() {
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'none';
        resultBox.className = 'result-box';
        initSimulation();
    }

    window.onload = initSimulation;
</script>

</body>
</html>
